# Keyless replay keeps the Fluent composition intact and replaces only the model adapter.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ../cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - insert:
          - id: fluent
            name: '@deepseek-ai/dsh-fluent'
          - id: fluent-local
            name: '@deepseek-ai/dsh-fluent-local'
            config:
              command: ./missing-fluent
          - id: timeout-policy
            name: '@deepseek-ai/dsh-tool-call-timeout-policy'
          - id: tool-fluent
            name: '@deepseek-ai/dsh-tool-fluent'
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
