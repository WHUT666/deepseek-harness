# Keyless best-of-N turbo composition for the headless stream-json snapshot.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - insert:
          - id: llm-turbo
            name: '@deepseek-ai/dsh-experimental-llm-turbo'
            config:
              numCandidates: 3
              majorityVoting: true
              verifier:
                provider: openai_compatible
                model: mock-verifier
                apiKeyEnv: TURBO_SNAPSHOT_UNUSED
                baseUrl: http://127.0.0.1:1
          - id: turbo-snapshot-backend
            name: './tests/fixtures/turbo-snapshot-backend.mjs'
